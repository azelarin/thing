[package]
name = "thing-ui"
description = "layout and input handling for thing widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
wgpu = ["femtovg/wgpu"]

[dependencies]
thing-core = { path = "../thing-core" }
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
femtovg = { version = "0.28.0", default-features = false, features = ["swash"] }
parley = "0.6.0"
unicode-segmentation = "1.13.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.47", default-features = false }
freedesktop-icons = "0.4"

[lints]
workspace = true
