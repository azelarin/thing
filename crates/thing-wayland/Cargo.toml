[package]
name = "thing-wayland"
description = "wayland surfaces and event loop for thing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
vulkan = [
    "thing-ui/vulkan",
    "dep:ash",
    "dep:skia-safe",
]

[dependencies]
thing-core = { path = "../thing-core" }
thing-runtime = { path = "../thing-runtime" }
thing-ui = { path = "../thing-ui" }
ash = { version = "0.38.0", optional = true, default-features = false, features = ["debug", "loaded", "std"] }
skia-safe = { version = "=0.156.0", optional = true, default-features = false, features = ["ganesh", "vulkan"] }
smithay-client-toolkit = "0.20.0"
xkbcommon = "0.8.0"
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
calloop = { version = "0.14.4", features = ["signals"] }
calloop-wayland-source = "0.4.1"
async-io = "2.6.0"
futures-lite = "2.6.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
libc = "0.2"
libpulse-binding = "2.30.1"
serde_json = "1"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[dev-dependencies]
tempfile = "3.27"
wayland-server = "0.31.13"
wayland-protocols = { version = "0.32.13", features = ["server", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["server"] }

[lints]
workspace = true
