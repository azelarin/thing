name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - name: check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libpulse-dev fonts-dejavu-core
      - name: check formatting
        run: cargo fmt --all --check
      - name: run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: run rust tests
        run: cargo test --locked --workspace
      - name: build documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: run tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
