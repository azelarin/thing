name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libpulse-dev fonts-dejavu-core
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
